include: [sensor-device.yaml, i2c-device.yaml]

properties:
  current-lsb-microamps:
    type: int
    required: true
    description: |
      This value should be selected so that measurement resolution is
      maximized, that is:

        current-lsb(A) = maximum expected current(A) / 2^15

      (sensor has 15 bits). For example, if maximum expected current is 15A:

        current-lsb(A) = 15A / 2^15 ~= 457uA

      Rounded values may be used for convenience, e.g. 500uA/LSB or 1mA/LSB
      while keeping a good measurement resolution. The units are in uA/LSB
      so that low maximum currents can be measured with enough resolution.

  rshunt-micro-ohms:
    type: int
    required: true
    description: Shunt resistor value in microOhms

  alert-gpios:
    type: phandle-array
    description: Alert pin

  fetch-channels:
    type: string-array
    enum:
      - bus-voltage
      - shunt-voltage
      - current
      - power
      - die-temperature
      - energy
      - charge
    description: |
      Channels read by SENSOR_CHAN_ALL, in the driver's normal register order.
      If omitted, all channels supported by the device are read, preserving
      the default behavior. The list must be nonempty and contain only channels
      supported by the device variant. Explicit single-channel fetches remain
      available, including channels not listed here. Retrieve a channel only
      after fetching it; unselected cached values are not refreshed by ALL.
      This property controls I2C register reads, not ADC operating mode,
      conversion time, averaging, or physical conversion enablement. Configure
      those separately. For example, [bus-voltage, shunt-voltage] avoids reading
      current, power and temperature when only raw bus/shunt data is needed.
